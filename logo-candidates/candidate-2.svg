    Candidate 2: a brick kiln with an ember-lit arch, a latte cup firing
    inside. Three vent holes across the dome echo the dock indicator dots.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="kilnBody" x1="24" y1="11" x2="24" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d97a4f"/>
      <stop offset="1" stop-color="#b0512e"/>
    </linearGradient>
    <linearGradient id="hearth" x1="24" y1="40.5" x2="24" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9c4527"/>
      <stop offset="1" stop-color="#83381f"/>
    </linearGradient>
    <radialGradient id="emberGlow" cx="24" cy="40.5" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffedc2"/>
      <stop offset="0.5" stop-color="#ffab4f"/>
      <stop offset="1" stop-color="#e8531c"/>
    </radialGradient>
    <linearGradient id="archShadowFade" x1="17" y1="21" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M 6,42 V 27 A 18,16 0 0 1 42,27 V 42 Z"/>
    </clipPath>
  </defs>
  <path id="body" fill="url(#kilnBody)" d="M 6,42 V 27 A 18,16 0 0 1 42,27 V 42 Z"/>
  <path id="archShadow" clip-path="url(#bodyClip)" opacity="0.22" fill="url(#archShadowFade)"
        d="M 17.28,20.78 A 9.5,9.5 0 0 1 33.5,27.5 L 33.5,40.5 L 63.5,70.5 L 47.28,50.78 Z"/>
  <rect id="slab" x="4" y="40.5" width="40" height="4.5" rx="1.4" fill="url(#hearth)"/>
  <path id="opening" fill="#3b241c" d="M 14.5,40.5 V 27.5 A 9.5,9.5 0 0 1 33.5,27.5 V 40.5 Z"/>
  <path id="glow" fill="url(#emberGlow)" d="M 16,40.5 V 28 A 8,8 0 0 1 32,28 V 40.5 Z"/>
  <g id="firingCup" fill="#3b241c">
    <path id="cupBody" d="M 20,31 H 28 L 27.1,36.8 Q 26.93,37.9 25.75,37.9 H 22.25 Q 21.07,37.9 20.9,36.8 Z"/>
    <path id="cupHandle" fill="none" stroke="#3b241c" stroke-width="1.6" d="M 27.8,32.2 C 30.6,32 30.6,36.2 27.5,36"/>
  </g>
  <g id="ventDots" fill="#eddbbc">
    <circle cx="17" cy="18.5" r="1.6"/>
    <circle cx="24" cy="15.8" r="1.6"/>
    <circle cx="31" cy="18.5" r="1.6"/>
  </g>
</svg>
