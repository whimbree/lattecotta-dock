    Candidate 3: top-down latte in a fired terracotta cup. Two zones only
    (clay rim, caramel crema), an ember-lit seam where they meet, and a
    poured milk heart with its start dot as the hero mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="clayRim" x1="24" y1="4" x2="24" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d2693e"/>
      <stop offset="1" stop-color="#a84b28"/>
    </linearGradient>
    <linearGradient id="emberSeam" x1="24" y1="7.6" x2="24" y2="40.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc36a"/>
      <stop offset="1" stop-color="#ff8a3c"/>
    </linearGradient>
    <linearGradient id="cremaField" x1="24" y1="8.5" x2="24" y2="39.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8b971"/>
      <stop offset="1" stop-color="#c08e49"/>
    </linearGradient>
    <linearGradient id="milkHeart" x1="24" y1="31.5" x2="24" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3e0c1"/>
      <stop offset="1" stop-color="#fff7eb"/>
    </linearGradient>
    <linearGradient id="heartShadowFade" x1="24" y1="22" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="discClip">
      <circle cx="24" cy="24" r="20"/>
    </clipPath>
  </defs>
  <circle id="rim" cx="24" cy="24" r="20" fill="url(#clayRim)"/>
  <circle id="seam" cx="24" cy="24" r="16.4" fill="url(#emberSeam)"/>
  <circle id="cremaDisc" cx="24" cy="24" r="15.5" fill="url(#cremaField)"/>
  <g clip-path="url(#discClip)" opacity="0.2" fill="url(#heartShadowFade)">
    <path id="dotShadow" d="M 22.9,11.3 L 25.1,9.3 L 45,29.2 L 42.8,31.4 Z"/>
    <path id="heartShadow" d="M 14.9,15.2 L 18.7,12.7 L 24,15.7 L 29.3,12.7 L 33.2,15.2 L 34,19 L 55,40 L 46.5,53.5 L 24,32.2 Z"/>
  </g>
  <circle id="pourDot" cx="24" cy="10.4" r="1.5" fill="url(#milkHeart)"/>
  <path id="heart" fill="url(#milkHeart)"
        d="M 24,32.18 C 20.22,28.4 14.28,24.62 14.28,18.9 C 14.28,15.44 16.66,13.28 19.57,13.28 C 21.52,13.28 23.14,14.36 24,16.09 C 24.86,14.36 26.48,13.28 28.43,13.28 C 31.34,13.28 33.72,15.44 33.72,18.9 C 33.72,24.62 27.78,28.4 24,32.18 Z"/>
  <path id="rimEdge" fill="#8f3f22" d="M 43.978516,23.418 A 20,20 0 0 1 24,43 20,20 0 0 1 4.0214844,23.582 20,20 0 0 0 4,24 a 20,20 0 0 0 20,20 20,20 0 0 0 20,-20 20,20 0 0 0 -0.02148,-0.582 z"/>
</svg>
