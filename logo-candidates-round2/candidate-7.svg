    Candidate 7: the script L, kiln-warmed. Varlesh's hand-made script L
    (from the original latte-dock icon) in cream, tilted a touch, on a
    soft hand-poured peach blob with a rosy glow rising from the base,
    and the three dock dots redrawn with a gentle wobble in size and
    height. The L path is Varlesh's, verbatim.
-->
