    Candidate 6: cozy cup, docked. A squat cream cup with a gentle tilt
    and a droopy round handle, warmed from below by a rosy ember glow,
    three asymmetric steam wisps rising, sitting on a warm caramel
    saucer-bar with the three dock dots in cream.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="emberHalo" cx="23" cy="38" r="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffa584" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffa584" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cupCeramic" x1="24" y1="16" x2="24" y2="38.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf0e0"/>
      <stop offset="0.62" stop-color="#f8ddc0"/>
      <stop offset="1" stop-color="#f4bd9a"/>
    </linearGradient>
    <linearGradient id="saucerBar" x1="24" y1="39.5" x2="24" y2="44.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cf9455"/>
      <stop offset="1" stop-color="#ad743c"/>
    </linearGradient>
    <linearGradient id="coffeeTop" x1="24" y1="15" x2="24" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e3a768"/>
      <stop offset="1" stop-color="#c98d5a"/>
    </linearGradient>
  </defs>
  <ellipse id="halo" cx="23" cy="37" rx="20" ry="13" fill="url(#emberHalo)"/>
  <rect id="dockBar" x="8" y="39.5" width="32" height="5" rx="2.5" fill="url(#saucerBar)"/>
  <g id="dockDots" fill="#fff3e0">
    <circle cx="17.8" cy="41.9" r="1.35"/>
    <circle cx="24.1" cy="42.15" r="1.45"/>
    <circle cx="30.2" cy="41.95" r="1.3"/>
  </g>
  <g id="cup" transform="rotate(-3 24 30)">
    <circle id="handle" cx="38.2" cy="27.2" r="4.5" fill="none" stroke="#efc79c" stroke-width="3.2"/>
    <path id="cupBody" fill="url(#cupCeramic)"
          d="M 12.6,17.5 C 12.9,24.5 13.8,31.5 15.6,35.6 C 16.4,37.4 18.0,38.4 20.0,38.5 L 28.2,38.5 C 30.2,38.4 31.8,37.4 32.5,35.5 C 34.3,31.3 35.1,24.3 35.4,17.5 Z"/>
    <ellipse id="cupRim" cx="24" cy="17.5" rx="11.4" ry="3.4" fill="#fdf0e0"/>
    <ellipse id="coffee" cx="24" cy="17.5" rx="9.7" ry="2.6" fill="url(#coffeeTop)"/>
    <path id="milkSwirl" fill="#fff6e8" opacity="0.9"
          d="M 21.1,17.2 C 22.2,16.3 24.4,16.2 25.6,17.0 C 26.6,17.7 26.1,18.6 24.8,18.7 C 23.2,18.8 21.6,18.4 21.1,17.2 Z"/>
  </g>
  <g id="steam" fill="none" stroke="#f9e9d0" stroke-linecap="round">
    <path id="wisp1" d="M 20.4,13.2 C 17.6,9.8 23.4,8.0 20.8,4.2" stroke-width="1.7" opacity="0.9"/>
    <path id="wisp2" d="M 27.6,13.8 C 30.2,10.6 24.9,8.6 27.5,4.4" stroke-width="1.5" opacity="0.7"/>
    <path id="wisp3" d="M 24.1,11.6 C 22.9,10.0 25.5,9.0 24.3,7.2" stroke-width="1.15" opacity="0.5"/>
  </g>
</svg>
