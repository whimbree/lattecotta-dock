    Candidate 8: steam heart. A small squat cream cup with a rosy ember
    glow under its base, and its steam gathering into one soft cream
    heart above, fed by a thin wisp still rising off the coffee.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="steamHeart" x1="24" y1="27.8" x2="24" y2="10.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7e3c6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fffdf7"/>
    </linearGradient>
    <linearGradient id="cupCream" x1="24" y1="33.6" x2="24" y2="43.9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf0e0"/>
      <stop offset="0.6" stop-color="#f8dcc0"/>
      <stop offset="1" stop-color="#f2b995"/>
    </linearGradient>
    <linearGradient id="coffeePeach" x1="24" y1="31.4" x2="24" y2="35.9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d29358"/>
      <stop offset="1" stop-color="#b87a42"/>
    </linearGradient>
    <radialGradient id="emberUnder" cx="24" cy="44.5" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9d7a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff9d7a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse id="emberGlow" cx="24" cy="43.5" rx="11.5" ry="3.6" fill="url(#emberUnder)"/>
  <g id="heartSteam">
    <path id="steamHeartShape" fill="url(#steamHeart)" opacity="0.92" transform="rotate(-8 24 19) translate(3.3 3.6) scale(0.86)"
          d="M 24.6,27.8 C 21.0,24.4 15.2,21.2 14.8,16.4 C 14.5,13.3 16.7,11.2 19.3,11.4 C 21.2,11.55 22.7,12.8 23.5,14.4 C 24.3,12.7 25.7,11.6 27.5,11.7 C 29.9,11.85 31.9,13.9 31.5,16.9 C 30.9,21.2 27.3,24.2 24.6,27.8 Z"/>
    <path id="feedWisp" fill="none" stroke="#f9e7cd" stroke-width="1.5" stroke-linecap="round" opacity="0.75"
          d="M 25.8,27.2 C 24.2,28.7 26.6,29.7 25.2,31.5"/>
    <path id="sideWisp" fill="none" stroke="#f9e7cd" stroke-width="1.15" stroke-linecap="round" opacity="0.5"
          d="M 33.3,24.2 C 32.3,22.4 34.5,21.0 33.3,18.8"/>
  </g>
  <g id="cup" transform="rotate(2 24 38) translate(-1.92 -3.08) scale(1.08)">
    <circle id="handle" cx="36.8" cy="38" r="3.1" fill="none" stroke="#f3d4b4" stroke-width="2.4"/>
    <path id="cupBody" fill="url(#cupCream)"
          d="M 13.2,33.6 C 13.6,37.8 14.7,41.2 16.3,42.5 C 18.2,43.9 29.8,43.9 31.7,42.5 C 33.3,41.2 34.4,37.8 34.8,33.6 C 30.0,36.5 18.0,36.5 13.2,33.6 Z"/>
    <ellipse id="cupRim" cx="24" cy="33.6" rx="10.8" ry="3.0" fill="#fdf0e0"/>
    <ellipse id="coffee" cx="24" cy="33.6" rx="9.2" ry="2.3" fill="url(#coffeePeach)"/>
  </g>
</svg>
