SPDX-License-Identifier: GPL-2.0-or-later

Lattecotta candidate 11: the espresso line. Five cream cups on a
caramel bar, seen from the side, their sizes swelling to a peak and
easing off again, the dock's parabolic zoom made of crockery. The
peak cup is full, steaming, with a droopy handle; an ember glow pools
on the bar beneath it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="c11-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffa584" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffa584" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c11-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf9455"/>
      <stop offset="1" stop-color="#a9713a"/>
    </linearGradient>
    <linearGradient id="c11-cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9ef"/>
      <stop offset="1" stop-color="#f5ddbd"/>
    </linearGradient>
    <linearGradient id="c11-coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e69c5d"/>
      <stop offset="1" stop-color="#c67f42"/>
    </linearGradient>
    <linearGradient id="c11-steamfade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fdeed7"/>
      <stop offset="1" stop-color="#fdeed7" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- rosy glow behind the peak cup -->
  <ellipse cx="23.5" cy="29" rx="20" ry="16" fill="url(#c11-glow)"/>

  <!-- steam over the peak cup: three wisps, unequal height and sway -->
  <g id="c11-steam" fill="none" stroke-linecap="round">
    <path d="M 20.4 24.2 C 19.2 21.8 21.2 20.6 20.2 18.4 C 19.4 16.6 20.6 15.6 21.4 15.2"
          stroke="url(#c11-steamfade)" stroke-width="1.5"/>
    <path d="M 23.8 23.4 C 22.4 20.6 25.2 19.2 23.8 16.2 C 22.8 14.0 24.6 12.6 25.8 12.1"
          stroke="url(#c11-steamfade)" stroke-width="1.9"/>
    <path d="M 27.2 24.4 C 28.4 22.4 26.8 20.8 27.8 18.6"
          stroke="url(#c11-steamfade)" stroke-width="1.3" opacity="0.75"/>
  </g>

  <!-- the caramel bar the line sits on -->
  <rect id="c11-bar-shape" x="1.5" y="39" width="45" height="4.8" rx="2.4" fill="url(#c11-bar)"/>
  <!-- ember pooled on the bar under the peak, fresh from the kiln -->
  <ellipse cx="23.5" cy="39.5" rx="7" ry="1.4" fill="#ff9d7a" opacity="0.4"/>

  <!-- the wave: five cups, feet on the bar, sizes parabolic.
       Thin caramel edges keep cream shapes apart; the peak is drawn
       last so it magnifies over its neighbour, like the zoom does. -->
  <g id="c11-wave" stroke="#e8c79c" stroke-width="0.35">
    <g id="c11-cup1" transform="rotate(-3 5 39)">
      <path fill="url(#c11-cup)" d="M 2.7 35.4 L 3.2 38.3 Q 3.35 39.2 4.2 39.2 L 5.8 39.2
               Q 6.65 39.2 6.8 38.3 L 7.3 35.4 Z"/>
      <ellipse cx="5" cy="35.4" rx="2.4" ry="0.8" fill="url(#c11-cup)"/>
      <ellipse cx="5" cy="35.4" rx="1.9" ry="0.58" fill="url(#c11-coffee)" stroke="none"/>
    </g>
    <g id="c11-cup2" transform="rotate(2 12.3 39)">
      <path fill="url(#c11-cup)" d="M 8.3 32.4 L 9.1 37.6 Q 9.3 39.2 10.7 39.2 L 13.9 39.2
               Q 15.3 39.2 15.5 37.6 L 16.3 32.4 Z"/>
      <ellipse cx="12.3" cy="32.4" rx="4.2" ry="1.3" fill="url(#c11-cup)"/>
      <ellipse cx="12.3" cy="32.4" rx="3.5" ry="0.98" fill="url(#c11-coffee)" stroke="none"/>
    </g>
    <g id="c11-cup4" transform="rotate(2.5 36.2 39)">
      <path fill="url(#c11-cup)" d="M 32.45 32.9 L 33.2 37.7 Q 33.4 39.2 34.7 39.2 L 37.7 39.2
               Q 39.0 39.2 39.2 37.7 L 39.95 32.9 Z"/>
      <ellipse cx="36.2" cy="32.9" rx="3.95" ry="1.2" fill="url(#c11-cup)"/>
      <ellipse cx="36.2" cy="32.9" rx="3.3" ry="0.92" fill="url(#c11-coffee)" stroke="none"/>
    </g>
    <g id="c11-cup5" transform="rotate(-2 43.6 39)">
      <path fill="url(#c11-cup)" d="M 41.4 35.6 L 41.9 38.35 Q 42.0 39.2 42.85 39.2 L 44.35 39.2
               Q 45.2 39.2 45.3 38.35 L 45.8 35.6 Z"/>
      <ellipse cx="43.6" cy="35.6" rx="2.3" ry="0.75" fill="url(#c11-cup)"/>
      <ellipse cx="43.6" cy="35.6" rx="1.8" ry="0.56" fill="url(#c11-coffee)" stroke="none"/>
    </g>
    <g id="c11-peak" transform="rotate(-2.5 23.5 39)">
      <!-- droopy handle, sitting a bit low, over the neighbour it zooms past -->
      <circle cx="31.0" cy="31.6" r="2.4" fill="none" stroke="#e2b071" stroke-width="2.1"/>
      <path fill="url(#c11-cup)" d="M 16.5 26.9 L 17.7 37.2 Q 17.95 39.2 19.9 39.2 L 27.1 39.2
               Q 29.05 39.2 29.3 37.2 L 30.5 26.9 Z"/>
      <ellipse cx="23.5" cy="26.9" rx="7.4" ry="2.1" fill="url(#c11-cup)"/>
      <ellipse cx="23.5" cy="26.9" rx="6.5" ry="1.7" fill="url(#c11-coffee)" stroke="none"/>
      <!-- milk gleam on the coffee -->
      <ellipse cx="21.6" cy="26.7" rx="2.1" ry="0.55" fill="#fff3e0" opacity="0.85" stroke="none"/>
    </g>
  </g>
</svg>
