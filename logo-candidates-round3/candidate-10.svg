<?xml version="1.0" encoding="UTF-8"?>
<!--
SPDX-FileCopyrightText: 2026 Bree Spektor
SPDX-FileCopyrightText: 2026 Latte Dock contributors
SPDX-License-Identifier: GPL-2.0-or-later

Lattecotta candidate 10: clay tile zoom. Five kiln-fired ceramic
tiles, the dock's icon row itself, drawn mid-sweep: sizes rise to a
peak and fall, each tile tilted a little as if nudged by the pointer.
The peak tile is the fired-terracotta one and carries the poured milk
heart and a curl of steam.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="c10-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffa584" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffa584" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c10-ceramic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd5a6"/>
      <stop offset="1" stop-color="#e5975c"/>
    </linearGradient>
    <linearGradient id="c10-terracotta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#de855a"/>
      <stop offset="1" stop-color="#b45c3c"/>
    </linearGradient>
    <linearGradient id="c10-milk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f9e7cb"/>
    </linearGradient>
    <linearGradient id="c10-steamfade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffefda"/>
      <stop offset="1" stop-color="#ffefda" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- rosy glow pooled behind the peak of the wave -->
  <ellipse cx="24" cy="30" rx="21" ry="17" fill="url(#c10-glow)"/>

  <!-- soft ground shadow -->
  <ellipse cx="24" cy="42.4" rx="17.5" ry="1.9" fill="#e0997a" opacity="0.26"/>

  <!-- steam curling off the peak tile -->
  <g id="c10-steam" fill="none" stroke-linecap="round">
    <path d="M 23.2 24.6 C 21.4 22.0 24.6 20.4 23.2 17.6
             C 22.0 15.3 24.2 13.8 25.6 13.2"
          stroke="url(#c10-steamfade)" stroke-width="2.1"/>
    <path d="M 27.2 24.8 C 28.6 22.6 26.8 20.9 27.9 18.6"
          stroke="url(#c10-steamfade)" stroke-width="1.4" opacity="0.7"/>
  </g>

  <!-- the wave: five tiles, bottoms on the dock line, sizes parabolic -->
  <g id="c10-wave">
    <rect id="c10-tile1" x="0.9" y="36.4" width="4.6" height="4.6" rx="1.3"
          fill="url(#c10-ceramic)" transform="rotate(-4 3.2 38.7)"/>
    <rect id="c10-tile2" x="6.7" y="32.5" width="8.5" height="8.5" rx="2.3"
          fill="url(#c10-ceramic)" transform="rotate(2.5 10.95 36.75)"/>
    <rect id="c10-tile4" x="32.8" y="33" width="8" height="8" rx="2.2"
          fill="url(#c10-ceramic)" transform="rotate(3 36.8 37)"/>
    <rect id="c10-tile5" x="42.1" y="36.2" width="4.8" height="4.8" rx="1.4"
          fill="url(#c10-ceramic)" transform="rotate(-3.5 44.5 38.6)"/>
    <g id="c10-peak" transform="rotate(-2 24 33.5)">
      <rect x="16.5" y="26" width="15" height="15" rx="4" fill="url(#c10-terracotta)"/>
      <!-- poured milk heart, tilted, lobes unequal, drag tail -->
      <g transform="rotate(-8 24 34)">
        <path fill="url(#c10-milk)"
              d="M 24 38.4
                 C 21.6 36.6 19.8 34.7 19.8 32.4
                 C 19.8 30.7 21.1 29.6 22.4 29.6
                 C 23.2 29.6 23.8 30.0 24.1 30.7
                 C 24.4 29.9 25.1 29.4 26.0 29.4
                 C 27.3 29.4 28.4 30.6 28.3 32.3
                 C 28.2 34.7 26.3 36.7 24 38.4 Z"/>
        <circle cx="24.1" cy="28.2" r="0.75" fill="url(#c10-milk)"/>
      </g>
    </g>
  </g>
</svg>
