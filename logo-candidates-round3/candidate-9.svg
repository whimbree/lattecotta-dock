Lattecotta candidate 9: parabolic latte wave. Five top-down clay cups
on a cream plate, sizes rising to a peak and falling again, the wave a
dock makes as the pointer sweeps it. The peak cup is a filled latte
with a poured milk heart.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="c9-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9ef"/>
      <stop offset="1" stop-color="#fae3c6"/>
    </linearGradient>
    <radialGradient id="c9-glow" cx="0.5" cy="0.55" r="0.58">
      <stop offset="0" stop-color="#ffa584" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffa584" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c9-clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#de855a"/>
      <stop offset="1" stop-color="#b85f3e"/>
    </linearGradient>
    <linearGradient id="c9-crema" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5b26f"/>
      <stop offset="1" stop-color="#bd854a"/>
    </linearGradient>
    <linearGradient id="c9-milk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f9e7cb"/>
    </linearGradient>
  </defs>

  <!-- plate with hand-poured corners, each rounded a little differently -->
  <path id="c9-plate-shape" fill="url(#c9-plate)"
        d="M 11.2 2.6 H 36.4 C 42.5 2.6 45.6 5.8 45.6 11.9 V 35.7
           C 45.6 42.3 42.2 45.5 35.8 45.5 H 12.3
           C 5.9 45.5 2.5 42.1 2.5 35.6 V 12.3
           C 2.5 5.9 5.5 2.6 11.2 2.6 Z"/>
  <rect x="2.5" y="2.6" width="43.1" height="42.9" fill="url(#c9-glow)"/>

  <!-- soft shadow pooled under the row -->
  <ellipse cx="24" cy="39.6" rx="16.5" ry="2.0" fill="#d99a72" opacity="0.28"/>

  <!-- the wave: bottoms on a common dock line, sizes parabolic.
       Cream keylines keep neighbours separate where the zoom overlaps
       them; the peak is drawn last so it magnifies over its neighbours. -->
  <g id="c9-wave" stroke="#fdf0e0" stroke-width="1">
    <g id="c9-cup1">
      <circle cx="6.4" cy="36.6" r="2.6" fill="url(#c9-clay)"/>
      <circle cx="6.4" cy="36.5" r="1.6" fill="url(#c9-crema)" stroke="none"/>
    </g>
    <g id="c9-cup2">
      <circle cx="13.5" cy="34.2" r="5.0" fill="url(#c9-clay)"/>
      <circle cx="13.5" cy="34.0" r="3.4" fill="url(#c9-crema)" stroke="none"/>
    </g>
    <g id="c9-cup5">
      <circle cx="41.6" cy="36.8" r="2.4" fill="url(#c9-clay)"/>
      <circle cx="41.6" cy="36.7" r="1.5" fill="url(#c9-crema)" stroke="none"/>
    </g>
    <g id="c9-cup4">
      <circle cx="34.5" cy="34.4" r="4.8" fill="url(#c9-clay)"/>
      <circle cx="34.5" cy="34.2" r="3.3" fill="url(#c9-crema)" stroke="none"/>
    </g>
    <g id="c9-peak" transform="rotate(-3 24 28.2)">
      <ellipse cx="24" cy="28.2" rx="11.0" ry="10.7" fill="url(#c9-clay)"/>
      <ellipse cx="24" cy="28.1" rx="8.6" ry="8.3" fill="url(#c9-crema)" stroke="none"/>
      <!-- poured milk heart, tilted, lobes unequal, drag tail -->
      <g transform="rotate(-7 24 28.6)" stroke="none">
        <path fill="url(#c9-milk)"
              d="M 24 33.9
                 C 21.2 31.8 19.1 29.6 19.1 27.0
                 C 19.1 25.0 20.6 23.7 22.1 23.7
                 C 23.0 23.7 23.7 24.2 24.1 25.0
                 C 24.5 24.1 25.3 23.5 26.3 23.5
                 C 27.8 23.5 29.1 24.9 29.0 26.9
                 C 28.9 29.6 26.7 31.9 24 33.9 Z"/>
        <circle cx="24.1" cy="21.9" r="0.85" fill="url(#c9-milk)"/>
      </g>
    </g>
  </g>
</svg>
