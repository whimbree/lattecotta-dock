Lattecotta candidate 12: the wave, poured. One big top-down latte in
a hand-thrown cream cup; the milk itself draws the dock's parabolic
zoom across the crema as string-of-pearls latte art, dots swelling to
a poured heart at the peak and easing off again, all dragged through
by one thin pour line.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="c12-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9ef"/>
      <stop offset="1" stop-color="#f2d9b4"/>
    </linearGradient>
    <linearGradient id="c12-crema" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddaa66"/>
      <stop offset="1" stop-color="#b57c42"/>
    </linearGradient>
    <radialGradient id="c12-ember" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#ff9d7a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9d7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c12-milk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f7e3c6"/>
    </linearGradient>
  </defs>

  <!-- hand-thrown cup, seen from above: both rims wobble -->
  <ellipse id="c12-cup" cx="24" cy="24.5" rx="21" ry="20.4" fill="url(#c12-rim)"
           transform="rotate(-4 24 24.5)"/>
  <ellipse id="c12-crema-pool" cx="24.2" cy="24.7" rx="17.6" ry="17.1" fill="url(#c12-crema)"
           transform="rotate(-2 24.2 24.7)"/>
  <!-- kiln warmth rising through the lower rim, under the milk -->
  <ellipse cx="24" cy="27" rx="17" ry="16" fill="url(#c12-ember)"/>

  <!-- the wave, poured in milk: string-of-pearls latte art, sizes
       parabolic, one drag line pulled through the whole row -->
  <g id="c12-wave" fill="url(#c12-milk)">
    <path id="c12-dragline" fill="none" stroke="#f9e9cf" stroke-width="1.05"
          stroke-linecap="round" opacity="0.8"
          d="M 8.5 31.6 C 14 30.2 18 28.4 24 28.2 C 30 28.4 34 30.2 39.7 31.4"/>
    <circle id="c12-pearl1" cx="9.2" cy="31.5" r="1.8"/>
    <circle id="c12-pearl2" cx="15.3" cy="30.2" r="3.2"/>
    <circle id="c12-pearl4" cx="33.2" cy="30.1" r="3.0"/>
    <circle id="c12-pearl5" cx="39.0" cy="31.3" r="1.7"/>
    <!-- the peak: a poured heart, tilted, lobes unequal, drag tail -->
    <g id="c12-peak" transform="rotate(-7 24 29)">
      <path d="M 24 35.6
               C 20.9 33.3 18.6 30.9 18.6 28.0
               C 18.6 25.8 20.2 24.3 21.9 24.3
               C 22.9 24.3 23.7 24.9 24.1 25.7
               C 24.5 24.7 25.4 24.0 26.5 24.0
               C 28.2 24.0 29.6 25.6 29.5 27.8
               C 29.4 30.8 27.0 33.4 24 35.6 Z"/>
      <circle cx="24.1" cy="22.4" r="0.9"/>
    </g>
  </g>
</svg>
